name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.0)"
        required: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate version consistency
        run: |
          TOML_VER=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          PKG_VER=$(python -c "import ast, sys; tree=ast.parse(open('dsp/__init__.py').read()); print([n.value.s for n in ast.walk(tree) if isinstance(n, ast.Assign) and any(t.id=='__version__' for t in n.targets if isinstance(t, ast.Name))][0])")
          TAG=${{ github.event_name == 'workflow_dispatch' && 'inputs.tag' || 'github.ref_name' }}
          echo "pyproject.toml: $TOML_VER | dsp.__version__: $PKG_VER"
          if [ "$TOML_VER" != "$PKG_VER" ]; then
            echo "Version mismatch between pyproject.toml and dsp/__init__.py"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dsp-palette/
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
